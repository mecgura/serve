# Nginx configuration for MecGuraServe

upstream django {
    server 127.0.0.1:8000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name mecguraserve.com *.mecguraserve.com;
    return 301 https://$host$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    server_name mecguraserve.com *.mecguraserve.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/mecguraserve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mecguraserve.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /var/www/mecguraserve/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /var/www/mecguraserve/media/;
        expires 7d;
    }

    # Favicon
    location /favicon.ico {
        alias /var/www/mecguraserve/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Django application
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "OK";
    }
}
